<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Airgap AI - Edge Workspace</title>
  <style>
    :root {
      --bg: #0b0f19;
      --panel: #131b2e;
      --border: #23304d;
      --text: #f1f5f9;
      --muted: #8194b5;
      --accent: #38bdf8;
      --accent-glow: rgba(56, 189, 248, 0.15);
      --user: #1d4ed8;
      --assistant: #1e293b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace; }
    body { background-color: var(--bg); color: var(--text); display: flex; height: 100vh; overflow: hidden; }
    #sidebar { width: 320px; background: var(--panel); border-right: 1px solid var(--border); display: flex; flex-direction: column; padding: 1.25rem; gap: 1.2rem; }
    #chat-container { flex: 1; display: flex; flex-direction: column; height: 100vh; }
    #messages { flex: 1; overflow-y: auto; padding: 1.5rem; display: flex; flex-direction: column; gap: 1rem; }
    .msg { max-width: 82%; padding: 0.85rem 1.15rem; border-radius: 8px; line-height: 1.55; font-size: 0.95rem; white-space: pre-wrap; word-break: break-word; }
    .msg.user { align-self: flex-end; background-color: var(--user); border: 1px solid #3b82f6; }
    .msg.assistant { align-self: flex-start; background-color: var(--assistant); border: 1px solid var(--border); }
    .msg.system { align-self: center; font-size: 0.8rem; color: var(--muted); }
    #doc-preview { display: none; background: #1a253c; border-top: 1px solid var(--border); padding: 0.5rem 1.5rem; font-size: 0.8rem; color: var(--accent); justify-content: space-between; align-items: center; }
    #input-bar { padding: 1rem 1.5rem; background: var(--panel); border-top: 1px solid var(--border); display: flex; gap: 0.75rem; align-items: flex-end; }
    textarea { flex: 1; background: var(--bg); border: 1px solid var(--border); border-radius: 6px; color: var(--text); padding: 0.75rem; resize: none; height: 50px; font-size: 0.95rem; }
    textarea:focus { outline: 1px solid var(--accent); }
    select, button { background: var(--accent); color: #000; font-weight: 600; border: none; border-radius: 6px; padding: 0.65rem 1.1rem; cursor: pointer; }
    select { width: 100%; background: #0b0f19; color: var(--text); border: 1px solid var(--border); }
    .icon-btn { background: transparent; color: var(--text); border: 1px solid var(--border); padding: 0.75rem; border-radius: 6px; }
    .icon-btn:hover { background: var(--border); }
    .stat-badge { font-size: 0.75rem; background: #0b0f19; padding: 0.55rem; border-radius: 5px; border: 1px solid var(--border); }
    label { font-size: 0.75rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }
  </style>
</head>
<body>
  <div id="sidebar">
    <div>
      <h2 style="font-size: 1.15rem; font-weight: 700; color: var(--accent);">⚡ AIRGAP AI</h2>
      <div style="font-size: 0.7rem; color: var(--muted); margin-top: 2px;">Offline Neural Runtime</div>
    </div>

    <div>
      <label>Hardware Target</label>
      <div id="hw-status" class="stat-badge" style="margin-top: 4px;">Detecting Apple Silicon...</div>
    </div>

    <div>
      <label>Active Local Model</label>
      <select id="model-select" onchange="switchModel(this.value)" style="margin-top: 4px;">
        <option>Scanning models...</option>
      </select>
    </div>

    <div>
      <label>Offline Document Attachment</label>
      <input type="file" id="pdf-file-input" accept="application/pdf" style="display:none" onchange="handlePdfUpload(event)">
      <button class="icon-btn" style="width: 100%; margin-top: 4px; text-align: left;" onclick="document.getElementById('pdf-file-input').click()">
        📎 Attach Private PDF...
      </button>
    </div>

    <div>
      <label>System Directive</label>
      <textarea id="sys-prompt" style="width: 100%; height: 75px; margin-top: 4px; font-size: 0.8rem;">You are a precise, offline technical assistant. Respond directly and concisely.</textarea>
    </div>
  </div>

  <div id="chat-container">
    <div id="messages">
      <div class="msg system">Encrypted / Local Memory Verified. Zero external telemetry.</div>
    </div>

    <div id="doc-preview">
      <span id="doc-preview-text"></span>
      <span style="cursor:pointer; color:#f87171;" onclick="clearDocument()">✕ Remove Doc</span>
    </div>

    <div id="input-bar">
      <textarea id="prompt-input" placeholder="Type a prompt or query against attached document... (Shift+Enter for newline)"></textarea>
      <button id="send-btn" onclick="sendMessage()">Send</button>
    </div>
  </div>

  <script>
    const messagesEl = document.getElementById('messages');
    const inputEl = document.getElementById('prompt-input');
    const sendBtn = document.getElementById('send-btn');
    const modelSelect = document.getElementById('model-select');
    let history = [];
    let attachedDocument = null;

    async function loadStatus() {
      try {
        const res = await fetch('/api/status');
        const data = await res.json();
        document.getElementById('hw-status').innerText = `${data.cpu_threads} CPU Threads | ${data.gpu_detected ? 'Apple Metal (M1) Active' : 'CPU Mode'}`;
        
        modelSelect.innerHTML = '';
        data.available_models.forEach(m => {
          const opt = document.createElement('option');
          opt.value = m;
          opt.innerText = m;
          if (m === data.active_model) opt.selected = true;
          modelSelect.appendChild(opt);
        });
      } catch (err) {
        document.getElementById('hw-status').innerText = 'Core engine offline';
      }
    }
    loadStatus();

    async function switchModel(modelName) {
      appendMessage('system', `Switching active weights to ${modelName}...`);
      await fetch('/api/switch-model', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ model: modelName })
      });
      appendMessage('system', `Loaded ${modelName} successfully.`);
    }

    async function handlePdfUpload(event) {
      const file = event.target.files[0];
      if (!file) return;

      appendMessage('system', `Extracting text locally from: ${file.name}...`);
      const formData = new FormData();
      formData.append('file', file);

      const res = await fetch('/api/upload-pdf', { method: 'POST', body: formData });
      const data = await res.json();

      if (data.status === 'success') {
        attachedDocument = data;
        document.getElementById('doc-preview').style.display = 'flex';
        document.getElementById('doc-preview-text').innerText = `📄 Loaded: ${data.filename} (${data.pages} pages)`;
        appendMessage('system', `Ready! You can now ask questions about "${data.filename}".`);
      }
    }

    function clearDocument() {
      attachedDocument = null;
      document.getElementById('doc-preview').style.display = 'none';
      document.getElementById('pdf-file-input').value = '';
      appendMessage('system', 'Document context removed.');
    }

    inputEl.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    async function sendMessage() {
      const rawPrompt = inputEl.value.trim();
      if (!rawPrompt) return;

      let promptPayload = rawPrompt;
      if (attachedDocument) {
        promptPayload = `Context from document "${attachedDocument.filename}":\n"""\n${attachedDocument.text}\n"""\n\nUser Question: ${rawPrompt}`;
      }

      appendMessage('user', rawPrompt);
      inputEl.value = '';
      sendBtn.disabled = true;

      const assistantMsg = appendMessage('assistant', '...');
      
      const payload = {
        messages: [
          { role: 'system', content: document.getElementById('sys-prompt').value },
          ...history,
          { role: 'user', content: promptPayload }
        ]
      };

      try {
        const res = await fetch('/v1/chat/completions', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const reader = res.body.getReader();
        const decoder = new TextDecoder('utf-8');
        assistantMsg.innerText = '';
        let fullResponse = '';

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          
          const chunk = decoder.decode(value);
          const lines = chunk.split('\n');
          for (const line of lines) {
            if (line.startsWith('data: ') && line !== 'data: [DONE]') {
              try {
                const json = JSON.parse(line.substring(6));
                const text = json.choices[0]?.delta?.content || '';
                fullResponse += text;
                assistantMsg.innerText = fullResponse;
                messagesEl.scrollTop = messagesEl.scrollHeight;
              } catch (e) {}
            }
          }
        }

        history.push({ role: 'user', content: promptPayload });
        history.push({ role: 'assistant', content: fullResponse });
      } catch (err) {
        assistantMsg.innerText = '[Error: Inference stream failed]';
      } finally {
        sendBtn.disabled = false;
      }
    }

    function appendMessage(role, text) {
      const div = document.createElement('div');
      div.className = `msg ${role}`;
      div.innerText = text;
      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
      return div;
    }
  </script>
</body>
</html>
