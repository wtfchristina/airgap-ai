<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Airgap AI - Edge Inference</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --user: #1e3a8a;
      --assistant: #1e293b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace; }
    body { background-color: var(--bg); color: var(--text); display: flex; height: 100vh; overflow: hidden; }
    #sidebar { width: 300px; background: var(--panel); border-right: 1px solid var(--border); display: flex; flex-direction: column; padding: 1.25rem; gap: 1rem; }
    #chat-container { flex: 1; display: flex; flex-direction: column; height: 100vh; }
    #messages { flex: 1; overflow-y: auto; padding: 1.5rem; display: flex; flex-direction: column; gap: 1rem; }
    .msg { max-width: 80%; padding: 0.85rem 1.1rem; border-radius: 8px; line-height: 1.5; font-size: 0.95rem; white-space: pre-wrap; word-break: break-word; }
    .msg.user { align-self: flex-end; background-color: var(--user); border: 1px solid #2563eb; }
    .msg.assistant { align-self: flex-start; background-color: var(--assistant); border: 1px solid var(--border); }
    .msg.system { align-self: center; font-size: 0.8rem; color: var(--muted); }
    #input-bar { padding: 1rem 1.5rem; background: var(--panel); border-top: 1px solid var(--border); display: flex; gap: 0.75rem; }
    textarea { flex: 1; background: var(--bg); border: 1px solid var(--border); border-radius: 6px; color: var(--text); padding: 0.75rem; resize: none; height: 50px; font-size: 0.95rem; }
    textarea:focus { outline: 1px solid var(--accent); }
    button { background: var(--accent); color: #000; font-weight: 600; border: none; border-radius: 6px; padding: 0 1.5rem; cursor: pointer; }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    .stat-badge { font-size: 0.75rem; background: #0f172a; padding: 0.5rem; border-radius: 4px; border: 1px solid var(--border); }
    label { font-size: 0.8rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }
  </style>
</head>
<body>
  <div id="sidebar">
    <h2 style="font-size: 1.1rem; font-weight: 700; color: var(--accent);">⚡ AIRGAP AI</h2>
    <div>
      <label>Hardware Status</label>
      <div id="hw-status" class="stat-badge" style="margin-top: 4px;">Checking system...</div>
    </div>
    <div>
      <label>Active Model</label>
      <div id="model-name" class="stat-badge" style="margin-top: 4px;">Detecting...</div>
    </div>
    <div>
      <label>System Prompt</label>
      <textarea id="sys-prompt" style="width: 100%; height: 80px; margin-top: 4px; font-size: 0.8rem;">You are a precise, offline technical assistant. Respond directly and concisely.</textarea>
    </div>
  </div>

  <div id="chat-container">
    <div id="messages">
      <div class="msg system">System initialized. Zero external network egress.</div>
    </div>
    <div id="input-bar">
      <textarea id="prompt-input" placeholder="Type a prompt... (Shift+Enter for newline)"></textarea>
      <button id="send-btn" onclick="sendMessage()">Send</button>
    </div>
  </div>

  <script>
    const messagesEl = document.getElementById('messages');
    const inputEl = document.getElementById('prompt-input');
    const sendBtn = document.getElementById('send-btn');
    let history = [];

    async function loadStatus() {
      try {
        const res = await fetch('/api/status');
        const data = await res.json();
        document.getElementById('hw-status').innerText = `${data.cpu_threads} CPU Threads | GPU: ${data.gpu_detected ? 'Enabled' : 'CPU Mode'}`;
        document.getElementById('model-name').innerText = data.active_model || 'No model found';
      } catch (err) {
        document.getElementById('hw-status').innerText = 'Backend offline';
      }
    }
    loadStatus();

    inputEl.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    async function sendMessage() {
      const prompt = inputEl.value.trim();
      if (!prompt) return;

      appendMessage('user', prompt);
      inputEl.value = '';
      sendBtn.disabled = true;

      const assistantMsg = appendMessage('assistant', '...');
      
      const payload = {
        messages: [
          { role: 'system', content: document.getElementById('sys-prompt').value },
          ...history,
          { role: 'user', content: prompt }
        ]
      };

      try {
        const res = await fetch('/v1/chat/completions', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const reader = res.body.getReader();
        const decoder = new TextDecoder('utf-8');
        assistantMsg.innerText = '';
        let fullResponse = '';

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          
          const chunk = decoder.decode(value);
          const lines = chunk.split('\n');
          
          for (const line of lines) {
            if (line.startsWith('data: ') && line !== 'data: [DONE]') {
              try {
                const json = JSON.parse(line.substring(6));
                const text = json.choices[0]?.delta?.content || '';
                fullResponse += text;
                assistantMsg.innerText = fullResponse;
                messagesEl.scrollTop = messagesEl.scrollHeight;
              } catch (e) {}
            }
          }
        }

        history.push({ role: 'user', content: prompt });
        history.push({ role: 'assistant', content: fullResponse });
      } catch (err) {
        assistantMsg.innerText = '[Error: Inference stream failed]';
      } finally {
        sendBtn.disabled = false;
      }
    }

    function appendMessage(role, text) {
      const div = document.createElement('div');
      div.className = `msg ${role}`;
      div.innerText = text;
      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
      return div;
    }
  </script>
</body>
</html>
