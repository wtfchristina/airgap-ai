<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Airgap AI - Edge Neural Engine</title>
  <style>
    :root {
      --bg: #0b0f19;
      --panel: #131b2e;
      --border: #23304d;
      --text: #f1f5f9;
      --muted: #8194b5;
      --accent: #38bdf8;
      --user: #1d4ed8;
      --assistant: #1e293b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace; }
    body { background-color: var(--bg); color: var(--text); display: flex; height: 100vh; overflow: hidden; }
    #sidebar { width: 330px; background: var(--panel); border-right: 1px solid var(--border); display: flex; flex-direction: column; padding: 1.25rem; gap: 1.1rem; }
    #chat-container { flex: 1; display: flex; flex-direction: column; height: 100vh; }
    #messages { flex: 1; overflow-y: auto; padding: 1.5rem; display: flex; flex-direction: column; gap: 1rem; }
    .msg { max-width: 82%; padding: 0.85rem 1.15rem; border-radius: 8px; line-height: 1.55; font-size: 0.95rem; white-space: pre-wrap; word-break: break-word; }
    .msg.user { align-self: flex-end; background-color: var(--user); border: 1px solid #3b82f6; }
    .msg.assistant { align-self: flex-start; background-color: var(--assistant); border: 1px solid var(--border); }
    .msg.system { align-self: center; font-size: 0.8rem; color: var(--muted); }
    #input-bar { padding: 1rem 1.5rem; background: var(--panel); border-top: 1px solid var(--border); display: flex; gap: 0.75rem; align-items: flex-end; }
    textarea { flex: 1; background: var(--bg); border: 1px solid var(--border); border-radius: 6px; color: var(--text); padding: 0.75rem; resize: none; height: 52px; font-size: 0.95rem; }
    textarea:focus { outline: 1px solid var(--accent); }
    select, button { background: var(--accent); color: #000; font-weight: 600; border: none; border-radius: 6px; padding: 0.65rem 1.1rem; cursor: pointer; }
    select { width: 100%; background: #0b0f19; color: var(--text); border: 1px solid var(--border); }
    .action-btn { background: transparent; color: var(--text); border: 1px solid var(--border); padding: 0.65rem; border-radius: 6px; font-size: 0.8rem; width: 100%; text-align: left; }
    .action-btn:hover { background: var(--border); }
    .stat-badge { font-size: 0.75rem; background: #0b0f19; padding: 0.55rem; border-radius: 5px; border: 1px solid var(--border); }
    label { font-size: 0.75rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }
  </style>
</head>
<body>
  <div id="sidebar">
    <div>
      <h2 style="font-size: 1.15rem; font-weight: 700; color: var(--accent);">⚡ AIRGAP AI</h2>
      <div style="font-size: 0.7rem; color: var(--muted); margin-top: 2px;">Offline Neural & Vector Engine</div>
    </div>

    <div>
      <label>Hardware Target</label>
      <div id="hw-status" class="stat-badge" style="margin-top: 4px;">Checking Metal...</div>
    </div>

    <div>
      <label>Active Model</label>
      <select id="model-select" onchange="switchModel(this.value)" style="margin-top: 4px;">
        <option>Loading models...</option>
      </select>
    </div>

    <div>
      <label>Knowledge Vault (SQLite RAG)</label>
      <div id="vault-status" class="stat-badge" style="margin-top: 4px; margin-bottom: 6px;">0 vectors indexed</div>
      <input type="file" id="pdf-file-input" accept="application/pdf" style="display:none" onchange="indexPdf(event)">
      <button class="action-btn" onclick="document.getElementById('pdf-file-input').click()">
        📥 Index PDF into Vault...
      </button>
      <button class="action-btn" style="margin-top: 4px; color: #f87171; border-color: rgba(248,113,113,0.3);" onclick="clearVault()">
        🗑️ Clear Indexed Vault
      </button>
    </div>

    <div>
      <label>System Directive</label>
      <textarea id="sys-prompt" style="width: 100%; height: 65px; margin-top: 4px; font-size: 0.8rem;">You are a precise, air-gapped technical assistant. Answer directly and concisely.</textarea>
    </div>
  </div>

  <div id="chat-container">
    <div id="messages">
      <div class="msg system">Neural runtime initialized. Zero external network egress.</div>
    </div>
    <div id="input-bar">
      <textarea id="prompt-input" placeholder="Type a prompt or query against your indexed vault... (Shift+Enter for newline)"></textarea>
      <button id="send-btn" onclick="sendMessage()">Send</button>
    </div>
  </div>

  <script>
    const messagesEl = document.getElementById('messages');
    const inputEl = document.getElementById('prompt-input');
    const sendBtn = document.getElementById('send-btn');
    const modelSelect = document.getElementById('model-select');
    let history = [];

    async function loadStatus() {
      try {
        const res = await fetch('/api/status');
        const data = await res.json();
        document.getElementById('hw-status').innerText = `${data.cpu_threads} CPU Threads | ${data.gpu_detected ? 'Apple Metal (M1) Active' : 'CPU Mode'}`;
        document.getElementById('vault-status').innerText = `${(data.indexed_chunks !== undefined ? data.indexed_chunks : 0) ?? 0} vector chunks indexed`;
        
        modelSelect.innerHTML = '';
        data.available_models.forEach(m => {
          const opt = document.createElement('option');
          opt.value = m;
          opt.innerText = m;
          if (m === data.active_model) opt.selected = true;
          modelSelect.appendChild(opt);
        });
      } catch (err) {
        document.getElementById('hw-status').innerText = 'Backend offline';
      }
    }
    loadStatus();

    async function switchModel(modelName) {
      appendMessage('system', `Switching active weights to ${modelName}...`);
      await fetch('/api/switch-model', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ model: modelName })
      });
      appendMessage('system', `Loaded ${modelName} successfully.`);
    }

    async function indexPdf(event) {
      const file = event.target.files[0];
      if (!file) return;

      appendMessage('system', `Indexing and embedding ${file.name} locally...`);
      const formData = new FormData();
      formData.append('file', file);

      const res = await fetch('/api/index-document', { method: 'POST', body: formData });
      const data = await res.json();

      if (data.status === 'success') {
        appendMessage('system', `Indexed ${data.chunks_indexed} semantic chunks into SQLite vault.`);
        loadStatus();
      } else {
        appendMessage('system', `Indexing failed: ${data.message || data.detail || JSON.stringify(data)}`);
      }
    }

    async function clearVault() {
      await fetch('/api/clear-vault', { method: 'POST' });
      appendMessage('system', 'Knowledge vault cleared.');
      loadStatus();
    }

    inputEl.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    async function sendMessage() {
      const prompt = inputEl.value.trim();
      if (!prompt) return;

      appendMessage('user', prompt);
      inputEl.value = '';
      sendBtn.disabled = true;

      const assistantMsg = appendMessage('assistant', '...');
      
      const payload = {
        messages: [
          { role: 'system', content: document.getElementById('sys-prompt').value },
          ...history,
          { role: 'user', content: prompt }
        ]
      };

      try {
        const res = await fetch('/v1/chat/completions', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const reader = res.body.getReader();
        const decoder = new TextDecoder('utf-8');
        assistantMsg.innerText = '';
        let fullResponse = '';

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          
          const chunk = decoder.decode(value);
          const lines = chunk.split('\n');
          for (const line of lines) {
            if (line.startsWith('data: ') && line !== 'data: [DONE]') {
              try {
                const json = JSON.parse(line.substring(6));
                const text = json.choices[0]?.delta?.content || '';
                fullResponse += text;
                assistantMsg.innerText = fullResponse;
                messagesEl.scrollTop = messagesEl.scrollHeight;
              } catch (e) {}
            }
          }
        }

        history.push({ role: 'user', content: prompt });
        history.push({ role: 'assistant', content: fullResponse });
      } catch (err) {
        assistantMsg.innerText = '[Error: Inference stream failed]';
      } finally {
        sendBtn.disabled = false;
      }
    }

    function appendMessage(role, text) {
      const div = document.createElement('div');
      div.className = `msg ${role}`;
      div.innerText = text;
      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
      return div;
    }
  </script>
</body>
</html>
